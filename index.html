<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasgor Marem</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#020617;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}
.card.active{
  border:2px solid #22c55e;
}

.btn{
  background:#22c55e;
  color:white;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

.qty{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:10px;
}
.qty button{
  padding:6px 12px;
  font-size:16px;
}

.pedas-btn, .top-btn{
  padding:8px 10px;
  border:none;
  border-radius:6px;
  margin:5px;
  cursor:pointer;
  background:#1f2937;
  color:white;
}
.active{
  background:#ef4444 !important;
}

.dashboard{
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 NASGOR MAREM</h1>

<div id="menu"></div>

<!-- VARIAN -->
<div id="varianWrap" style="display:none;">
<h3>Varian (khusus Nasi Goreng)</h3>
<select id="varian">
  <option>Kecap</option>
  <option>Mawut</option>
  <option>Putihan</option>
  <option>Saos</option>
</select>
</div>

<h3>Level Pedas 🌶️</h3>
<div id="pedasWrap"></div>

<h3>Topping (+3k / item)</h3>
<div id="topWrap"></div>

<!-- QTY -->
<div class="qty">
<button onclick="qty--;updateQty()">-</button>
<span id="qty">1</span>
<button onclick="qty++;updateQty()">+</button>
</div>

<button class="btn" onclick="tambahItem()">+ Tambah ke Keranjang</button>

<div class="dashboard">
<h3>🧾 Pesanan</h3>
<div id="cart"></div>

<h2 id="total">Total: Rp0</h2>

<!-- QR -->
<div style="text-align:center;margin-top:20px;">
<h3 style="color:#22c55e;">🔥 Scan & Bayar</h3>
<img src="https://i.ibb.co.com/yc6swKvP/IMG-20260403-WA0007.jpg"
style="width:220px;border-radius:12px;">
</div>

<button onclick="kirimWA()" class="btn">
Saya Sudah Bayar
</button>

</div>

</div>

 <script>

// ===== STATE =====
let currentMenu = "";
let currentHarga = 11000;
let currentPedas = 2;
let currentTopping = [];
let qty = 1;
let cart = [];

// ===== DATA =====
const menuList = [
  {nama:"Nasi Goreng", harga:11000},
  {nama:"Mie Goreng", harga:11000},
  {nama:"Capcay", harga:11000}
];

const pedasList = ["0","1","2","3🔥","4🔥🔥"];
const toppingList = ["Dadar","Ceplok","Kerupuk"];

// ===== MENU =====
menuList.forEach((m)=>{
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `${m.nama} - Rp${m.harga.toLocaleString()}`;

  el.onclick = ()=>{
    document.querySelectorAll(".card")
      .forEach(x=>x.classList.remove("active"));

    el.classList.add("active");

    currentMenu = m.nama;
    currentHarga = m.harga;

    document.getElementById("varianWrap").style.display =
      m.nama==="Nasi Goreng" ? "block" : "none";
  };

  document.getElementById("menu").appendChild(el);
});

// auto pilih menu pertama
setTimeout(()=>{
  document.querySelectorAll(".card")[0].click();
},100);

// ===== PEDAS =====
pedasList.forEach((p,i)=>{
  const b = document.createElement("button");

  b.className = "pedas-btn";
  b.innerText = p;

  if(i===2){
    b.classList.add("active");
  }

  b.onclick = ()=>{
    currentPedas = i;

    document.querySelectorAll(".pedas-btn")
      .forEach(x=>x.classList.remove("active"));

    b.classList.add("active");
  };

  document.getElementById("pedasWrap").appendChild(b);
});

// ===== TOPPING =====
toppingList.forEach((t)=>{
  const b = document.createElement("button");

  b.className = "top-btn";
  b.innerText = t;

  b.onclick = ()=>{

    if(currentTopping.includes(t)){
      currentTopping =
        currentTopping.filter(x=>x!==t);

      b.classList.remove("active");

    } else {

      currentTopping.push(t);

      b.classList.add("active");
    }
  };

  document.getElementById("topWrap").appendChild(b);
});

// ===== QTY =====
function updateQty(){

  if(qty < 1){
    qty = 1;
  }

  document.getElementById("qty").innerText = qty;
}

// ===== TAMBAH =====
function tambahItem(){

  if(!currentMenu){
    alert("Pilih menu dulu");
    return;
  }

  let toppingHarga =
    currentTopping.length * 3000;

  cart.push({

    menu: currentMenu,

    harga:
      (currentHarga + toppingHarga) * qty,

    varian:
      currentMenu==="Nasi Goreng"
      ? document.getElementById("varian").value
      : "-",

    pedas: currentPedas,

    topping: [...currentTopping],

    qty: qty
  });

  renderCart();

  // reset
  qty = 1;
  currentTopping = [];

  updateQty();

  document.querySelectorAll(".top-btn")
    .forEach(x=>x.classList.remove("active"));

  alert("✅ Masuk keranjang");
}

// ===== RENDER =====
function renderCart(){

  let el = document.getElementById("cart");

  el.innerHTML = "";

  let total = 0;

  cart.forEach((item,i)=>{

    total += item.harga;

    const div = document.createElement("div");

    div.innerHTML = `
      ${i+1}. ${item.menu} x${item.qty}<br>
      Varian: ${item.varian}<br>
      Pedas: ${item.pedas}<br>
      Topping: ${item.topping.join(", ") || "-"}<br>
      Rp${item.harga.toLocaleString()}
      <hr>
    `;

    el.appendChild(div);
  });

  document.getElementById("total").innerText =
    "Total: Rp" + total.toLocaleString();
}

// ===== KIRIM =====
function kirimWA(){

  if(cart.length===0){
    alert("Keranjang kosong");
    return;
  }

  let text =
    "Halo Pak Zaki 🙌\n\nSaya pesan:\n\n";

  cart.forEach((item,i)=>{

    text += `${i+1}. ${item.menu} x${item.qty}\n`;
    text += `Varian: ${item.varian}\n`;
    text += `Pedas: ${item.pedas}\n`;
    text += `Topping: ${item.topping.join(", ") || "-"}\n`;
    text += `Rp${item.harga}\n\n`;

  });

  let total =
    cart.reduce((a,b)=>a+b.harga,0);

  fetch("https://script.google.com/macros/s/AKfycbyKM008NlZ4XAPlNsW02a-TU_cE7QD93SN9WbKvNQV4uzzjbQy09nWn_OkfPzZ7qEZY/exec", {
  method: "POST",

    mode: "no-cors",
headers: {
  "Content-Type": "text/plain"
}

  body: JSON.stringify({
    nama: "Customer",
    pesanan: text,
    total: total,
    alamat: "-"
  })

})

.then(res => res.text())

.then(result => {

  // DEBUG
  alert("RESPON SHEETS: " + result);

  // kalau sukses baru ke WA
  if(result.includes("OK")){

    window.location.href =
      "https://wa.me/6285708368706?text=" +
      encodeURIComponent(text);

  }

})

.catch(err => {

  // DEBUG ERROR
  alert("ERROR SHEETS: " + err);

});
}

</script> 
  

</body>
</html>
